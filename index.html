<html lang="en">

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:#183c58;

  min-height:100vh;

  background:

    radial-gradient(
      circle at 50% 0%,
      #ffffff 0%,
      transparent 35%
    ),

    linear-gradient(
      145deg,
      #bfe9ff,
      #8fd4f7 45%,
      #6bb9e5
    );

  display:flex;
  justify-content:center;

  overflow-x:hidden;
}


/* =====================================================
   GAME
===================================================== */

.game{

  width:min(760px,94vw);

  padding:
    30px
    0
    50px;

  text-align:center;

}


/* =====================================================
   HEADER
===================================================== */

.logo{

  margin:0;

  font-size:
    clamp(
      38px,
      10vw,
      72px
    );

  line-height:1;

  font-weight:1000;

  letter-spacing:-3px;

  color:white;

  text-shadow:
    0 4px 15px #2b79a955;

}

.subtitle{

  margin:
    12px
    0
    28px;

  color:#ffffff;

  font-size:12px;

  font-weight:1000;

  letter-spacing:5px;

  text-shadow:
    0 2px 8px #31749a55;

}


/* =====================================================
   CARD
===================================================== */

.quizCard{

  padding:
    28px;

  border-radius:30px;

  background:
    rgba(255,255,255,.76);

  border:
    2px solid
    rgba(255,255,255,.8);

  box-shadow:

    0 25px 70px
    rgba(34,104,145,.22),

    inset
    0 0 40px
    rgba(255,255,255,.4);

  backdrop-filter:
    blur(12px);

}


/* =====================================================
   QUESTION LABEL
===================================================== */

.questionNumber{

  color:#2796cf;

  font-size:12px;

  font-weight:1000;

  letter-spacing:3px;

  margin-bottom:10px;

  text-transform:uppercase;

}


.question{

  margin:
    0
    auto
    24px;

  max-width:650px;

  color:#174462;

  font-size:
    clamp(
      25px,
      6vw,
      40px
    );

  line-height:1.15;

  font-weight:1000;

}


/* =====================================================
   MEMBER GRID
===================================================== */

.memberGrid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;

  width:100%;

}


/* =====================================================
   MEMBER BUTTON
===================================================== */

.memberButton{

  width:100%;

  height:72px;

  min-height:72px;

  border:0;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #dff5ff,
      #b8e7fa
    );

  color:#164663;

  font-size:
    clamp(
      16px,
      4vw,
      20px
    );

  font-weight:1000;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:9px;

  box-shadow:
    0 6px 15px
    rgba(38,119,157,.15);

  transition:
    transform .15s,
    background .15s,
    box-shadow .15s;

}


.memberButton:hover{

  transform:
    translateY(-2px);

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #c5edff
    );

  box-shadow:
    0 10px 22px
    rgba(38,119,157,.22);

}


.memberButton:active{

  transform:
    scale(.97);

}


/* =====================================================
   QUIZ ANSWERS
===================================================== */

.answers{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;

}


.answerButton{

  width:100%;

  min-height:65px;

  border:2px solid
    #b9e4f6;

  border-radius:18px;

  background:#ffffff;

  color:#164663;

  padding:
    12px
    14px;

  font-size:16px;

  font-weight:900;

  cursor:pointer;

  transition:
    transform .12s,
    background .12s,
    border .12s;

}


.answerButton:hover{

  transform:
    translateY(-2px);

  background:#eaf8ff;

}


.answerButton:active{

  transform:
    scale(.98);

}


.answerButton.correct{

  background:#b9f4d1;

  border-color:#42bd78;

  color:#145b36;

}


.answerButton.wrong{

  background:#ffd0d6;

  border-color:#ef6675;

  color:#8b1e2b;

}


.answerButton.disabled{

  pointer-events:none;

}


/* =====================================================
   PROGRESS
===================================================== */

.progress{

  margin:
    0
    0
    20px;

}


.progressTrack{

  width:100%;

  height:9px;

  border-radius:999px;

  background:#d7edf7;

  overflow:hidden;

}


.progressBar{

  height:100%;

  width:0%;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #42b9ed,
      #167fc0
    );

  transition:
    width .3s;

}


/* =====================================================
   SCORE
===================================================== */

.scoreBox{

  padding:
    25px
    15px;

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      #e6f8ff,
      #c5ebfa
    );

  margin-bottom:20px;

}


.scoreTitle{

  font-size:13px;

  letter-spacing:3px;

  font-weight:1000;

  color:#3689b2;

}


.score{

  font-size:
    clamp(
      45px,
      12vw,
      75px
    );

  font-weight:1000;

  color:#176c9c;

  margin:5px 0;

}


.resultMessage{

  font-size:18px;

  font-weight:900;

}


/* =====================================================
   FUN FACTS
===================================================== */

.funFacts{

  margin-top:25px;

  text-align:left;

}


.funFactsTitle{

  text-align:center;

  color:#176c9c;

  font-size:24px;

  margin:
    0
    0
    15px;

}


.funFact{

  padding:14px 16px;

  margin-bottom:9px;

  border-radius:15px;

  background:#ffffff;

  border-left:
    5px solid
    #55bde9;

  font-weight:700;

  line-height:1.45;

}


/* =====================================================
   BUTTONS
===================================================== */

.primaryButton{

  width:100%;

  min-height:60px;

  border:0;

  border-radius:18px;

  background:
    linear-gradient(
      90deg,
      #168ac8,
      #42bce9
    );

  color:white;

  font-size:18px;

  font-weight:1000;

  cursor:pointer;

  box-shadow:
    0 8px 20px
    rgba(24,120,170,.25);

  margin-top:18px;

}


.primaryButton:active{

  transform:
    scale(.98);

}


.secondaryButton{

  width:100%;

  min-height:54px;

  border:2px solid #8ed0eb;

  border-radius:16px;

  background:#ffffff;

  color:#24749b;

  font-size:16px;

  font-weight:1000;

  cursor:pointer;

  margin-top:10px;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

  margin-top:22px;

  color:#ffffff;

  font-size:12px;

  line-height:1.6;

  opacity:.85;

}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{

  display:none !important;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .game{

    width:94vw;

    padding-top:20px;

  }


  .quizCard{

    padding:18px;

    border-radius:25px;

  }

    gap:9px;

  }

  }

    gap:9px;

  }


  .answerButton{

    min-height:58px;

  }


  .question{

    font-size:26px;

  }

</style>

</head>

    {
      q:"What is the name of Ye-on's pet cat?",
      answers:[
        "Leo",
        "Aru",
        "Kong",
        "Haneul"
      ],
      correct:0
    },

    {
      q:"What did Ye-on sing at her first audition?",
      answers:[
        "Price Tag",
        "Let It Go",
        "Holo",
        "The Boys"
      ],
      correct:0
    },

    {
      q:"What is Ye-on's specialty?",
      answers:[
        "Musicals",

        "Piano",
        "Ballet"
      ],
      correct:0
    },

    {
      q:"Which Harry Potter movie is Ye-on's favorite?",
      answers:[
        "The Sorcerer's Stone",
        "The Chamber of Secrets",
        "The Prisoner of Azkaban",
        "The Goblet of Fire"
      ],
      correct:0
    }

  ],

  facts:[

    "Ye-on was born in Yangsan, Gyeongsangnam-do, South Korea.",

    "She is an only child.",

    "She joined SM Entertainment after being contacted through DMs.",

    "Ye-on considers herself the 'Cutie' of Hearts2Hearts.",

    "She has the smallest hands among the Hearts2Hearts members.",

    "She is a morning person.",

    "Her favorite animal is a cat."

  ]

}

};


/* =====================================================
   GAME VARIABLES
===================================================== */

let selectedMember = null;

let currentQuestions = [];

let currentQuestion = 0;

let score = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const favoriteScreen =
  document.getElementById(
    "favoriteScreen"
  );

const quizScreen =
  document.getElementById(
    "quizScreen"
  );

const resultScreen =
  document.getElementById(
    "resultScreen"
  );

const quizQuestion =
  document.getElementById(
    "quizQuestion"
  );

const answers =
  document.getElementById(
    "answers"
  );

const questionCount =
  document.getElementById(
    "questionCount"
  );

const totalQuestions =
  document.getElementById(
    "totalQuestions"
  );

const progressBar =
  document.getElementById(
    "progressBar"
  );

const scoreElement =
  document.getElementById(
    "score"
  );

const resultMessage =
  document.getElementById(
    "resultMessage"
  );

const factMember =
  document.getElementById(
    "factMember"
  );

const funFactList =
  document.getElementById(
    "funFactList"
  );


/* =====================================================
   SELECT FAVORITE MEMBER
===================================================== */

function selectMember(member){

  selectedMember =
    member;

  currentQuestions =
    [...members[member].questions];

  currentQuestion = 0;

  score = 0;


  favoriteScreen.classList.add(
    "hidden"
  );

  resultScreen.classList.add(
    "hidden"
  );

  quizScreen.classList.remove(
    "hidden"
  );


  totalQuestions.textContent =
    currentQuestions.length;


  loadQuestion();

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

  const question =
    currentQuestions[
      currentQuestion
    ];


  questionCount.textContent =
    currentQuestion + 1;


  quizQuestion.textContent =
    question.q;


  progressBar.style.width =
    (
      currentQuestion /
      currentQuestions.length
      * 100
    ) + "%";


  answers.innerHTML = "";


  question.answers.forEach(
    (answer,index)=>{

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "answerButton";


      button.textContent =
        answer;


      button.onclick =
        ()=>{
          answerQuestion(
            index,
            button
          );
        };


      answers.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   ANSWER QUESTION
===================================================== */

function answerQuestion(
  selected,
  clickedButton
){

  const question =
    currentQuestions[
      currentQuestion
    ];


  const buttons =
    document.querySelectorAll(
      ".answerButton"
    );


  buttons.forEach(
    button=>{
      button.classList.add(
        "disabled"
      );
    }
  );


  if(
    selected ===
    question.correct
  ){

    score++;

    clickedButton.classList.add(
      "correct"
    );

  }else{

    clickedButton.classList.add(
      "wrong"
    );


    buttons[
      question.correct
    ].classList.add(
      "correct"
    );

  }


  setTimeout(()=>{

    currentQuestion++;


    if(
      currentQuestion <
      currentQuestions.length
    ){

      loadQuestion();

    }else{

      showResults();

    }

  },900);

}


/* =====================================================
   SHOW RESULTS
===================================================== */

function showResults(){

  quizScreen.classList.add(
    "hidden"
  );

  resultScreen.classList.remove(
    "hidden"
  );


  scoreElement.textContent =
    score +
    "/" +
    currentQuestions.length;


  let message;


  const percentage =
    score /
    currentQuestions.length *
    100;


  if(percentage===100){

    message =
      "👑 PERFECT! You know " +
      selectedMember +
      " so well!";

  }else if(percentage>=80){

    message =
      "🔥 Amazing! You're a true " +
      selectedMember +
      " expert!";

  }else if(percentage>=60){

    message =
      "💙 Great job! You know " +
      selectedMember +
      " pretty well!";

  }else if(percentage>=40){

    message =
      "✨ Not bad! Time to learn more about " +
      selectedMember +
      "!";

  }else{

    message =
      "🌱 Keep learning! " +
      selectedMember +
      " has more secrets to discover!";

  }


  resultMessage.textContent =
    message;


  factMember.textContent =
    selectedMember;


  showFunFacts();

}


/* =====================================================
   SHOW FUN FACTS
===================================================== */

function showFunFacts(){

  funFactList.innerHTML = "";


  const facts =
    members[
      selectedMember
    ].facts;


  /*
    Show all the extra facts.
  */

  facts.forEach(
    fact=>{

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "funFact";


      div.textContent =
        "💙 " + fact;


      funFactList.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   RESTART SAME MEMBER
===================================================== */

function restartQuiz(){

  currentQuestions =
    [...members[selectedMember].questions];

  currentQuestion = 0;

  score = 0;


  resultScreen.classList.add(
    "hidden"
  );

  quizScreen.classList.remove(
    "hidden"
  );


  loadQuestion();

}


/* =====================================================
   CHOOSE ANOTHER MEMBER
===================================================== */

function chooseAnotherMember(){

  selectedMember = null;

  currentQuestion = 0;

  score = 0;


  resultScreen.classList.add(
    "hidden"
  );

  quizScreen.classList.add(
    "hidden"
  );

  favoriteScreen.classList.remove(
    "hidden"
  );

}


/* =====================================================
   START
===================================================== */

</script>
